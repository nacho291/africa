<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#EEF1EA">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);height:100%;box-sizing:border-box}[hidden]{display:none!important}</style>
<title>Atlas de África</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap">
<style>
:root{
  --bg:#EEF1EA; --panel:#FFFFFF; --ink:#16232E; --muted:#5E6C72;
  --land:#D9E0D3; --land-hi:#C9D2C2; --border:#8A9A8F; --sea:#EEF1EA;
  --accent:#F0672E; --accent-ink:#FFFFFF;
  --ok:#2F9C5D; --ok-soft:#D7F0E1; --bad:#D9463E; --bad-soft:#F9DCDA;
  --m1:#CFE8D8; --m2:#9ED2B4; --m3:#5DBB86;
  --chip:#E3E8E0; --shadow:0 -6px 24px rgba(22,35,46,.10);
  --tab-bg:#E3E8E0; --tab-on:#16232E; --tab-on-ink:#FFFFFF;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#101820; --panel:#18232D; --ink:#EAF0F2; --muted:#9AAAB2;
    --land:#2A3947; --land-hi:#36485A; --border:#5E7385; --sea:#101820;
    --accent:#FF7A3D; --accent-ink:#161616;
    --ok:#4CC27A; --ok-soft:#1E3A2B; --bad:#F06A62; --bad-soft:#452325;
    --m1:#24483A; --m2:#2F6E52; --m3:#3E9A6B;
    --chip:#25323D; --shadow:0 -6px 24px rgba(0,0,0,.45);
    --tab-bg:#25323D; --tab-on:#EAF0F2; --tab-on-ink:#101820;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#101820; --panel:#18232D; --ink:#EAF0F2; --muted:#9AAAB2;
  --land:#2A3947; --land-hi:#36485A; --border:#5E7385; --sea:#101820;
  --accent:#FF7A3D; --accent-ink:#161616;
  --ok:#4CC27A; --ok-soft:#1E3A2B; --bad:#F06A62; --bad-soft:#452325;
  --m1:#24483A; --m2:#2F6E52; --m3:#3E9A6B;
  --chip:#25323D; --shadow:0 -6px 24px rgba(0,0,0,.45);
  --tab-bg:#25323D; --tab-on:#EAF0F2; --tab-on-ink:#101820;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;font-weight:600;font-size:15px;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column}

/* header */
header{padding:10px 16px 8px;display:flex;flex-direction:column;gap:8px}
.topline{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{font-weight:900;font-size:18px;letter-spacing:-.01em}
.brand small{font-weight:700;color:var(--muted);font-size:12px;margin-left:6px}
.progress{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);font-weight:700}
.bar{width:72px;height:8px;border-radius:4px;background:var(--chip);overflow:hidden}
.bar i{display:block;height:100%;background:var(--m3);width:0%;transition:width .4s}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:var(--tab-bg);padding:4px;border-radius:12px}
.tabs button{padding:8px 4px;border-radius:9px;font-weight:800;font-size:13px;color:var(--muted);transition:background .15s,color .15s}
.tabs button[aria-selected="true"]{background:var(--tab-on);color:var(--tab-on-ink)}

/* map */
#mapwrap{flex:1;position:relative;min-height:0;background:var(--sea)}
svg{width:100%;height:100%;display:block;touch-action:none}
.country{fill:var(--land);stroke:var(--border);stroke-width:.8;stroke-linejoin:round;transition:fill .2s}
.country.m1{fill:var(--m1)}.country.m2{fill:var(--m2)}.country.m3{fill:var(--m3)}
.country.sel{fill:var(--accent)!important;stroke:var(--ink);stroke-width:1.4}
.country.ok{fill:var(--ok)!important}
.country.bad{fill:var(--bad)!important}
.country.pulse{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{0%,100%{fill:var(--accent);opacity:1}50%{fill:var(--accent);opacity:.55}}
.isle{cursor:pointer}
.isle circle.hit{fill:transparent;stroke:none}
.isle circle.dot{fill:var(--land);stroke:var(--border);stroke-width:1.2;transition:fill .2s}
.isle.m1 .dot{fill:var(--m1)}.isle.m2 .dot{fill:var(--m2)}.isle.m3 .dot{fill:var(--m3)}
.isle.sel .dot{fill:var(--accent);stroke:var(--ink)}
.isle.ok .dot{fill:var(--ok)}.isle.bad .dot{fill:var(--bad)}
.isle.pulse .dot{animation:pulse 1s ease-in-out infinite}
.isle line{stroke:var(--border);stroke-width:1;stroke-dasharray:3 3}
@media (prefers-reduced-motion: reduce){.pulse,.isle.pulse .dot{animation:none;fill:var(--accent)}}
.zoom{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:38px;height:38px;border-radius:10px;background:var(--panel);box-shadow:0 2px 8px rgba(0,0,0,.15);font-weight:900;font-size:18px;display:grid;place-items:center}
.hint{position:absolute;left:12px;bottom:10px;font-size:11px;color:var(--muted);font-weight:700;pointer-events:none}
.hud{position:absolute;left:12px;top:12px;display:flex;gap:6px;font-variant-numeric:tabular-nums}
.hud span{background:var(--panel);border-radius:10px;padding:6px 10px;font-weight:900;font-size:14px;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.hud .streak{color:var(--accent)}
.hud .streak:empty{display:none}
.toast{position:absolute;left:50%;top:14px;transform:translateX(-50%) translateY(-8px);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:999px;font-weight:900;font-size:14px;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.good{background:var(--ok);color:#fff}.toast.badt{background:var(--bad);color:#fff}

/* bottom panel */
footer{background:var(--panel);box-shadow:var(--shadow);border-radius:18px 18px 0 0;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;min-height:118px}
.q-label{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;display:flex;justify-content:space-between;font-variant-numeric:tabular-nums}
.q{font-size:22px;font-weight:900;line-height:1.15;text-wrap:balance}
.q .cap{color:var(--accent)}
.sub{color:var(--muted);font-size:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{padding:12px 18px;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:900;font-size:15px}
.btn.ghost{background:var(--chip);color:var(--ink)}
.btn.sm{padding:8px 12px;font-size:13px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opts button{padding:13px 10px;border-radius:12px;background:var(--chip);font-weight:800;font-size:15px;text-align:center;line-height:1.15;transition:background .15s,transform .1s}
.opts button.ok{background:var(--ok);color:#fff}
.opts button.bad{background:var(--bad);color:#fff}
.opts button:disabled{opacity:.75}
.mastery{display:inline-flex;gap:3px;vertical-align:middle;margin-left:6px}
.mastery i{width:9px;height:9px;border-radius:50%;background:var(--chip)}
.mastery i.on{background:var(--m3)}
.stat{display:flex;gap:14px;font-size:13px;color:var(--muted);font-weight:700}
.stat b{color:var(--ink);font-size:16px;font-variant-numeric:tabular-nums}

/* overlays */
.overlay{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));gap:14px;overflow:auto;z-index:10}
.overlay h2{margin:0;font-size:28px;font-weight:900;letter-spacing:-.01em;text-wrap:balance}
.stars{font-size:44px;letter-spacing:4px;color:var(--accent)}
.stars .off{color:var(--chip)}
.big{font-size:56px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--panel);border-radius:14px;padding:12px 14px}
.tile small{display:block;color:var(--muted);font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em}
.tile b{font-size:22px;font-variant-numeric:tabular-nums}
.list{background:var(--panel);border-radius:14px;overflow:hidden}
.list button{display:flex;width:100%;justify-content:space-between;align-items:center;padding:11px 14px;border-bottom:1px solid var(--bg);text-align:left;font-weight:700}
.list button:last-child{border-bottom:0}
.list .cap{color:var(--muted);font-size:13px}
.review{display:flex;flex-direction:column;gap:6px}
.review div{display:flex;justify-content:space-between;padding:8px 12px;border-radius:10px;background:var(--panel);font-size:14px}
.review div.f{background:var(--bad-soft)}
.review div.g{background:var(--ok-soft)}
.rank{background:var(--panel);border-radius:14px;padding:12px 14px;display:flex;gap:12px;align-items:center}
.rank .t{font-weight:900;font-size:18px}
.rank .d{color:var(--muted);font-size:13px}
</style>

</head>
<body>
<div id="app">
  <header>
    <div class="topline">
      <div class="brand">Atlas de África <small>55 países</small></div>
      <button class="progress" id="progressBtn" aria-label="Ver progreso">
        <span id="progTxt">0/55</span><span class="bar"><i id="progBar"></i></span>
      </button>
    </div>
    <div class="tabs" role="tablist">
      <button role="tab" data-mode="explore" aria-selected="true">Explorar</button>
      <button role="tab" data-mode="locate" aria-selected="false">Localizar</button>
      <button role="tab" data-mode="name" aria-selected="false">Nombrar</button>
      <button role="tab" data-mode="capital" aria-selected="false">Capitales</button>
    </div>
  </header>
  <div id="mapwrap">
    <svg id="map" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 760" preserveAspectRatio="xMidYMid meet" aria-label="Mapa de África">
      <g id="view"><g id="countries"></g><g id="isles"></g></g>
    </svg>
    <div class="hud"><span id="hudScore" hidden>0</span><span class="streak" id="hudStreak"></span></div>
    <div class="zoom">
      <button id="zin" aria-label="Acercar">+</button>
      <button id="zout" aria-label="Alejar">−</button>
      <button id="zreset" aria-label="Centrar" style="font-size:14px">⌂</button>
    </div>
    <div class="hint">Pellizca para hacer zoom · arrastra para mover</div>
    <div class="toast" id="toast"></div>
  </div>
  <footer id="panel"></footer>
</div>
<div class="overlay" id="results" hidden></div>
<div class="overlay" id="progress" hidden></div>

const FICHA = ['DZ','CV','BF','BJ','AO','BW','BI']; // capitales escritas en la ficha
const ISO = Object.keys(C);
const ISLES = ['CV','ST','KM','MU','SC'];
const WITHCAP = ISO.slice();
const ROUND = 10, MAXQ = 160; // 100 base + 50 rapidez + 10 racha... tope aprox.

// ---------- persistencia ----------
const KEY='atlas-africa-v1';
let save = {mastery:{}, best:{}, played:0};
try{ const s=JSON.parse(localStorage.getItem(KEY)); if(s&&s.mastery) save=Object.assign(save,s);}catch(e){}
function persist(){ try{localStorage.setItem(KEY,JSON.stringify(save));}catch(e){} }
const lvl = iso => Math.min(3, save.mastery[iso]||0);
const mastered = () => ISO.filter(k=>lvl(k)>=2).length;

// ---------- mapa ----------
const svg=document.getElementById('map'), view=document.getElementById('view');
const gC=document.getElementById('countries'), gI=document.getElementById('isles');
const els={};
for(const iso of ISO){
  const p=GEO.paths[iso]; if(!p) continue;
  if(ISLES.includes(iso)){
    const g=document.createElementNS(svg.namespaceURI,'g'); g.classList.add('isle'); g.dataset.iso=iso;
    const [cx,cy]=p.c;
    g.innerHTML=`<path d="${p.d}" fill="var(--border)" stroke="none"/><circle class="hit" cx="${cx}" cy="${cy}" r="22"/><circle class="dot" cx="${cx}" cy="${cy}" r="9"/>`;
    gI.appendChild(g); els[iso]=g;
  } else {
    const path=document.createElementNS(svg.namespaceURI,'path');
    path.setAttribute('d',p.d); path.classList.add('country'); path.dataset.iso=iso;
    gC.appendChild(path); els[iso]=path;
  }
}
function paintMastery(){ for(const iso of ISO){ const e=els[iso]; e.classList.remove('m1','m2','m3'); if(showMastery && lvl(iso)>0) e.classList.add('m'+lvl(iso)); } }
function clearMarks(){ for(const iso of ISO) els[iso].classList.remove('sel','ok','bad','pulse'); }
let showMastery=true;

// pan / zoom sobre <g id=view>
let k=1,tx=0,ty=0; const KMIN=1,KMAX=6;
function apply(){ view.setAttribute('transform',`translate(${tx} ${ty}) scale(${k})`); }
function toBase(x,y){ const pt=svg.createSVGPoint(); pt.x=x; pt.y=y; return pt.matrixTransform(svg.getScreenCTM().inverse()); }
function zoomAt(bx,by,f){ const nk=Math.max(KMIN,Math.min(KMAX,k*f)); f=nk/k; tx=bx-(bx-tx)*f; ty=by-(by-ty)*f; k=nk; clamp(); apply(); }
function clamp(){ if(k===1){tx=0;ty=0;} const W=GEO.W,H=GEO.H; tx=Math.min(W*0.5, Math.max(W-W*k-W*0.5, tx)); ty=Math.min(H*0.5, Math.max(H-H*k-H*0.5, ty)); }
function resetView(){k=1;tx=0;ty=0;apply();}
function focusOn(iso){ const c=GEO.paths[iso].c; const f=ISLES.includes(iso)?3.2:(GEO.paths[iso].area<700?3:1.8); k=1;tx=0;ty=0; zoomAt(c[0],c[1],f); tx+= (GEO.W/2-c[0])*1; ty+=(GEO.H/2-c[1])*1; tx=GEO.W/2-c[0]*k; ty=GEO.H/2-c[1]*k; clamp(); apply(); }
document.getElementById('zin').onclick=()=>zoomAt(GEO.W/2,GEO.H/2,1.5);
document.getElementById('zout').onclick=()=>zoomAt(GEO.W/2,GEO.H/2,1/1.5);
document.getElementById('zreset').onclick=resetView;

const ptrs=new Map(); let gesture=null;
svg.addEventListener('pointerdown',e=>{ svg.setPointerCapture(e.pointerId); ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===1) gesture={type:'tap',x0:e.clientX,y0:e.clientY,t0:Date.now(),tx0:tx,ty0:ty,target:e.target.closest('[data-iso]')};
  else if(ptrs.size===2){ const [a,b]=[...ptrs.values()]; gesture={type:'pinch',d0:Math.hypot(a.x-b.x,a.y-b.y),k0:k,tx0:tx,ty0:ty,mid:{x:(a.x+b.x)/2,y:(a.y+b.y)/2}}; }
});
svg.addEventListener('pointermove',e=>{ if(!ptrs.has(e.pointerId)) return; ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY}); if(!gesture) return;
  if(gesture.type!=='pinch'){ const dx=e.clientX-gesture.x0, dy=e.clientY-gesture.y0;
    if(gesture.type==='tap' && Math.hypot(dx,dy)>8) gesture.type='pan';
    if(gesture.type==='pan'){ const a=toBase(gesture.x0,gesture.y0), b=toBase(e.clientX,e.clientY); tx=gesture.tx0+(b.x-a.x); ty=gesture.ty0+(b.y-a.y); clamp(); apply(); }
  } else { const [a,b]=[...ptrs.values()]; const d=Math.hypot(a.x-b.x,a.y-b.y); const mid={x:(a.x+b.x)/2,y:(a.y+b.y)/2};
    const f=Math.max(KMIN,Math.min(KMAX,gesture.k0*(d/gesture.d0)))/gesture.k0; const m0=toBase(gesture.mid.x,gesture.mid.y), m1=toBase(mid.x,mid.y);
    k=gesture.k0*f; tx=m0.x-(m0.x-gesture.tx0)*f+(m1.x-m0.x); ty=m0.y-(m0.y-gesture.ty0)*f+(m1.y-m0.y); clamp(); apply(); }
});
function endPtr(e){ if(!ptrs.has(e.pointerId)) return; ptrs.delete(e.pointerId);
  if(gesture&&gesture.type==='tap'&&Date.now()-gesture.t0<500&&gesture.target){ onTap(gesture.target.dataset.iso); }
  gesture=null; if(ptrs.size===1){ const [p]=[...ptrs.values()]; gesture={type:'pan',x0:p.x,y0:p.y,tx0:tx,ty0:ty}; }
}
svg.addEventListener('pointerup',endPtr); svg.addEventListener('pointercancel',endPtr);
svg.addEventListener('wheel',e=>{ e.preventDefault(); const p=toBase(e.clientX,e.clientY); zoomAt(p.x,p.y,e.deltaY<0?1.15:1/1.15); },{passive:false});

// ---------- UI helpers ----------
const panel=document.getElementById('panel'), toastEl=document.getElementById('toast');
let toastT; function toast(msg,cls){ toastEl.textContent=msg; toastEl.className='toast show '+(cls||''); clearTimeout(toastT); toastT=setTimeout(()=>toastEl.classList.remove('show'),1300); }
function dots(iso){ return `<span class="mastery">${[1,2,3].map(i=>`<i class="${lvl(iso)>=i?'on':''}"></i>`).join('')}</span>`; }
function updateProgress(){ const m=mastered(); document.getElementById('progTxt').textContent=m+'/55'; document.getElementById('progBar').style.width=(m/55*100)+'%'; }
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.random()*(i+1)|0; [a[i],a[j]]=[a[j],a[i]]; } return a; }
function pick(pool,n){ // prioriza países poco dominados
  const w=pool.map(k=>({k,w:1/(1+lvl(k)*1.2)+Math.random()*.6})); w.sort((a,b)=>b.w-a.w); return w.slice(0,n).map(x=>x.k);
}
function rankTitle(m){ return m>=50?'Maestro de África':m>=35?'Cartógrafo':m>=20?'Explorador':m>=8?'Aprendiz':'Novato'; }
const vib=p=>{ try{ navigator.vibrate&&navigator.vibrate(p);}catch(e){} };

// ---------- modos ----------
let mode='explore', game=null, onTap=()=>{};
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));
function setMode(m){ mode=m; game=null; document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.mode===m));
  clearMarks(); resetView(); document.getElementById('hudScore').hidden=true; document.getElementById('hudStreak').textContent='';
  showMastery=(m==='explore'); paintMastery();
  if(m==='explore') explore(); else lobby(m);
}

// Explorar
function explore(){
  panel.innerHTML=`<div class="q-label"><span>Explorar</span><span>Toca un país</span></div><div class="q">¿Dónde está cada país?</div><div class="sub">Los colores verdes marcan lo que ya dominas. Las islas pequeñas son los puntos.</div>`;
  onTap=iso=>{ clearMarks(); els[iso].classList.add('sel'); const [n,cap]=C[iso];
    panel.innerHTML=`<div class="q-label"><span>Explorar</span><span>${lvl(iso)>=2?'Dominado':lvl(iso)>0?'En progreso':'Sin practicar'}</span></div>
      <div class="q">${n}${dots(iso)}</div><div class="sub">Capital: <b>${cap}</b>${FICHA.includes(iso)?' <span class="cap">★ en la ficha</span>':''}</div>`; vib(8); };
}

// Lobby de juego
const MODES={locate:{t:'Localizar',d:'Te decimos el país y lo tocas en el mapa.'},name:{t:'Nombrar',d:'Se ilumina un país y eliges su nombre.'},capital:{t:'Capitales',d:'Las 55 capitales: país ↔ capital, en los dos sentidos.'}};
function lobby(m){ const best=save.best[m]||0;
  panel.innerHTML=`<div class="q-label"><span>${MODES[m].t}</span><span>Ronda de ${ROUND}</span></div><div class="q">${MODES[m].d}</div>
   <div class="row"><button class="btn" id="start">Empezar ronda</button><span class="stat"><span>Récord <b>${best}</b></span></span></div>`;
  document.getElementById('start').onclick=()=>startGame(m); onTap=()=>{};
}

function startGame(m){
  const qs = m==='capital' ? pick(ISO,ROUND).map((iso,i)=>({iso,kind:i%2?'cap2map':'map2cap'})) : pick(ISO,ROUND).map(iso=>({iso}));
  game={m,qs,i:0,score:0,streak:0,best:0,log:[],tries:0,t0:0,locked:false};
  document.getElementById('hudScore').hidden=false; nextQ();
}
function hud(){ document.getElementById('hudScore').textContent=game.score; document.getElementById('hudStreak').textContent=game.streak>=2?`🔥 ${game.streak}`:''; }
function nextQ(){ if(game.i>=game.qs.length) return finish(); clearMarks(); resetView(); game.tries=0; game.t0=Date.now(); game.locked=false; hud();
  const q=game.qs[game.i], iso=q.iso, [name,cap]=C[iso]; const label=`${MODES[game.m].t}`, cnt=`${game.i+1}/${game.qs.length}`;
  if(game.m==='locate' || (game.m==='capital'&&q.kind==='cap2map')){
    panel.innerHTML=`<div class="q-label"><span>${label}</span><span>${cnt}</span></div>
      <div class="q">${game.m==='locate'?`Toca <span class="cap">${name}</span>`:`¿De qué país es capital <span class="cap">${cap}</span>?`}</div><div class="sub" id="fb">${ISLES.includes(iso)?'Pista: es una isla, busca un punto.':'Toca el país en el mapa.'}</div>`;
    onTap=t=>{ if(game.locked) return; if(t===iso) correct(); else wrong(t); };
  } else {
    els[iso].classList.add('pulse'); focusOn(iso);
    const pool = game.m==='name' ? ISO.filter(k=>k!==iso) : WITHCAP.filter(k=>k!==iso);
    const opts=shuffle([iso,...shuffle(pool).slice(0,3)]);
    panel.innerHTML=`<div class="q-label"><span>${label}</span><span>${cnt}</span></div>
      <div class="q">${game.m==='name'?'¿Qué país está iluminado?':`¿Cuál es la capital de <span class="cap">${name}</span>?`}</div>
      <div class="opts">${opts.map(o=>`<button data-o="${o}">${game.m==='name'?C[o][0]:C[o][1]}</button>`).join('')}</div>`;
    panel.querySelectorAll('.opts button').forEach(b=>b.onclick=()=>{ if(game.locked) return; if(b.dataset.o===iso){ b.classList.add('ok'); correct(); } else { b.classList.add('bad'); b.disabled=true; wrong(null); } });
    onTap=()=>{};
  }
}
function correct(){ const q=game.qs[game.i], iso=q.iso; game.locked=true;
  const secs=(Date.now()-game.t0)/1000; const first=game.tries===0;
  let pts=first?100:game.tries===1?60:30; const speed=first?Math.max(0,Math.round(50-secs*8)):0; game.streak=first?game.streak+1:0; const sb=Math.min(50,Math.max(0,(game.streak-1)*10));
  pts+=speed+sb; game.score+=pts; game.best=Math.max(game.best,game.streak);
  if(first) save.mastery[iso]=Math.min(3,(save.mastery[iso]||0)+1);
  game.log.push({iso,ok:first,pts}); persist(); updateProgress(); hud();
  els[iso].classList.remove('pulse'); els[iso].classList.add('ok');
  toast(`+${pts}${sb?` · racha ${game.streak}`:''}${speed>=30?' · ¡rápido!':''}`,'good'); vib(20);
  setTimeout(()=>{game.i++;nextQ();},900);
}
function wrong(t){ const q=game.qs[game.i], iso=q.iso; game.tries++; game.streak=0; hud(); vib([30,40,30]);
  if(t){ els[t].classList.add('bad'); setTimeout(()=>els[t].classList.remove('bad'),600); }
  const fb=document.getElementById('fb');
  if(game.tries>=3){ game.locked=true; save.mastery[iso]=0; persist(); updateProgress(); game.log.push({iso,ok:false,pts:0});
    clearMarks(); els[iso].classList.add('ok'); focusOn(iso); toast(`Era ${game.m==='capital'&&q.kind==='map2cap'?C[iso][1]:C[iso][0]}`,'badt');
    if(fb) fb.textContent='Fíjate bien dónde está.'; else panel.querySelectorAll('.opts button').forEach(b=>{b.disabled=true; if(b.dataset.o===iso) b.classList.add('ok');});
    setTimeout(()=>{game.i++;nextQ();},1600);
  } else { toast(t?`No, eso es ${C[t][0]}`:'No es esa','badt'); if(fb) fb.textContent=`Intento ${game.tries+1} de 3`; }
}
function finish(){ const m=game.m; const max=game.qs.length*MAXQ; const pct=game.score/max; const stars=pct>=.75?3:pct>=.45?2:pct>=.2?1:0;
  const isBest=game.score>(save.best[m]||0); if(isBest) save.best[m]=game.score; save.played++; persist();
  const acc=game.log.filter(l=>l.ok).length;
  const r=document.getElementById('results'); r.hidden=false; r.innerHTML=`
    <div class="q-label"><span>${MODES[m].t}</span><span>Ronda terminada</span></div>
    <h2>${stars===3?'¡Impresionante!':stars===2?'¡Muy bien!':stars===1?'Vas mejorando':'Sigue practicando'}</h2>
    <div class="stars">${'★'.repeat(stars)}<span class="off">${'★'.repeat(3-stars)}</span></div>
    <div class="big">${game.score}<span style="font-size:18px;color:var(--muted)"> pts</span></div>
    ${isBest?`<div style="color:var(--accent);font-weight:900">🏆 Nuevo récord</div>`:`<div class="sub">Récord: ${save.best[m]}</div>`}
    <div class="grid2"><div class="tile"><small>A la primera</small><b>${acc}/${game.log.length}</b></div><div class="tile"><small>Mejor racha</small><b>${game.best}</b></div></div>
    <div class="review">${game.log.map(l=>`<div class="${l.ok?'g':'f'}"><span>${C[l.iso][0]}${m==='capital'?` · ${C[l.iso][1]}`:''}</span><b>${l.ok?'✓':'✗'} ${l.pts}</b></div>`).join('')}</div>
    <div class="row"><button class="btn" id="again">Otra ronda</button><button class="btn ghost" id="back">Volver al mapa</button></div>`;
  r.scrollTop=0;
  document.getElementById('again').onclick=()=>{r.hidden=true;startGame(m);};
  document.getElementById('back').onclick=()=>{r.hidden=true;setMode(m);};
}

// Progreso
document.getElementById('progressBtn').onclick=()=>{ const p=document.getElementById('progress'); p.hidden=false; const m=mastered();
  const sorted=[...ISO].sort((a,b)=>C[a][0].localeCompare(C[b][0]));
  p.innerHTML=`<div class="q-label"><span>Tu progreso</span><span>${save.played} rondas</span></div>
   <div class="rank"><div style="font-size:34px">${m>=50?'🏆':m>=35?'🧭':m>=20?'🗺️':'📍'}</div><div><div class="t">${rankTitle(m)}</div><div class="d">${m} de 55 países dominados · siguiente rango: ${m>=50?'¡ya eres el máximo!':m>=35?'50':m>=20?'35':m>=8?'20':'8'}</div></div></div>
   <div class="grid2">${['locate','name','capital'].map(k=>`<div class="tile"><small>${MODES[k].t}</small><b>${save.best[k]||0}</b></div>`).join('')}</div>
   <div class="sub">Un país se considera dominado cuando lo aciertas a la primera dos veces seguidas. Fallarlo tres veces lo reinicia.</div>
   <div class="list">${sorted.map(k=>`<button data-go="${k}"><span>${C[k][0]}${C[k][1]?` <span class="cap">· ${C[k][1]}</span>`:''}</span>${dots(k)}</button>`).join('')}</div>
   <div class="row"><button class="btn ghost" id="pclose">Cerrar</button><button class="btn ghost sm" id="preset">Borrar progreso</button></div>`;
  p.scrollTop=0;
  document.getElementById('pclose').onclick=()=>p.hidden=true;
  document.getElementById('preset').onclick=e=>{ if(e.target.dataset.sure){ save={mastery:{},best:{},played:0}; persist(); updateProgress(); paintMastery(); p.hidden=true; setMode('explore'); } else { e.target.dataset.sure='1'; e.target.textContent='¿Seguro? Toca otra vez'; } };
  p.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{ p.hidden=true; setMode('explore'); onTap(b.dataset.go); focusOn(b.dataset.go); });
};

updateProgress(); paintMastery(); explore(); apply();
})();
</script>

</body>
</html>
